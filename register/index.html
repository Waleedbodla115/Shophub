<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShopHub - Create Account</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../login/login.css">
<style>
.auth-note{font-size:13px;color:#6b7280;line-height:1.6;margin-top:12px;text-align:center}.password-strength{font-size:12px;margin-top:7px;color:#6b7280}.message.success{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.login-form .input-wrapper input{padding-right:45px}
</style>
</head>
<body>
<header class="site-header"><div class="container navbar"><a href="../index.html" class="logo"><span class="logo-icon"><i class="fas fa-bag-shopping"></i></span><span class="logo-text">ShopHub</span></a><a href="../shop/index.html" class="back-shop"><i class="fas fa-arrow-left"></i> Back to Shop</a></div></header>
<main class="login-page"><div class="login-container"><div class="login-card">
<div class="login-icon"><i class="fas fa-user-plus"></i></div>
<div class="login-heading"><span class="section-label">JOIN SHOPHUB</span><h1>Create your account</h1><p>Register once and manage your shopping, checkout and orders.</p></div>
<div id="message" class="message" hidden></div>
<form id="registerForm" class="login-form" novalidate>
<div class="form-group"><label for="name">Full Name</label><div class="input-wrapper"><i class="fas fa-user"></i><input id="name" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required></div></div>
<div class="form-group"><label for="email">Email Address</label><div class="input-wrapper"><i class="fas fa-envelope"></i><input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required></div></div>
<div class="form-group"><label for="password">Password</label><div class="input-wrapper"><i class="fas fa-lock"></i><input id="password" name="password" type="password" placeholder="Minimum 6 characters" autocomplete="new-password" required><button type="button" class="password-toggle" id="passwordToggle"><i class="fas fa-eye"></i></button></div><div id="strength" class="password-strength">Use at least 6 characters.</div></div>
<div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="input-wrapper"><i class="fas fa-lock"></i><input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat your password" autocomplete="new-password" required></div></div>
<button type="submit" class="login-btn" id="registerBtn"><span id="registerBtnText">Create Account</span><i id="registerBtnIcon" class="fas fa-arrow-right"></i></button>
</form>
<div class="register-section"><p>Already have an account?</p><a href="../login/index.html">Login to ShopHub</a></div>
<div class="secure-login"><i class="fas fa-shield-halved"></i><span>Your password is securely hashed on the backend.</span></div>
</div></div></main>
<footer class="site-footer"><div class="container"><p>© 2026 ShopHub. All rights reserved.</p></div></footer>
<script src="./register.js"></script>
    <script src="../chatbot/chatbot.js"></script>
</body></html>
