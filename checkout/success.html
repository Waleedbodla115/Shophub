
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ShopHub Order Success"
    >

    <title>ShopHub - Order Confirmed</title>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background: #f8fafc;
            color: #111827;

            display: flex;
            flex-direction: column;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        .site-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }


        .container {
            width: min(1200px, 92%);
            margin: 0 auto;
        }


        .navbar {
            min-height: 76px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            font-size: 22px;
            font-weight: 800;
        }


        .logo-icon {
            width: 40px;
            height: 40px;

            border-radius: 10px;

            background: #111827;
            color: #ffffff;

            display: grid;
            place-items: center;
        }


        .home-link {
            color: #4b5563;
            font-size: 14px;
            font-weight: 600;
        }


        .home-link:hover {
            color: #111827;
        }


        .success-page {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 70px 0;
        }


        .success-card {
            width: min(600px, 100%);

            background: #ffffff;

            border: 1px solid #e5e7eb;

            border-radius: 20px;

            padding: 50px 35px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.07);
        }


        .success-icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #dcfce7;
            color: #15803d;

            display: grid;
            place-items: center;

            font-size: 42px;
        }


        .success-label {
            display: inline-block;

            margin-bottom: 10px;

            color: #15803d;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 1.5px;
        }


        .success-card h1 {
            font-size: clamp(30px, 5vw, 44px);

            line-height: 1.15;

            letter-spacing: -1px;
        }


        .success-card p {
            margin-top: 14px;

            color: #6b7280;

            font-size: 15px;

            line-height: 1.7;
        }


        .order-number {
            margin: 25px auto;

            padding: 15px 20px;

            border-radius: 12px;

            background: #f3f4f6;

            color: #374151;

            font-size: 13px;
        }


        .order-number strong {
            color: #111827;
        }


        .actions {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 25px;
        }


        .btn {
            min-height: 48px;

            padding: 0 22px;

            border-radius: 10px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            font-size: 13px;
            font-weight: 700;

            transition: 0.2s ease;
        }


        .btn-primary {
            background: #111827;
            color: #ffffff;
        }


        .btn-primary:hover {
            background: #000000;
            transform: translateY(-2px);
        }


        .btn-secondary {
            border: 1px solid #d1d5db;
            color: #374151;
            background: #ffffff;
        }


        .btn-secondary:hover {
            background: #f3f4f6;
        }


        .site-footer {
            padding: 20px 0;

            background: #111827;

            color: #9ca3af;

            text-align: center;

            font-size: 11px;
        }


        @media (max-width: 600px) {

            .navbar {
                min-height: 65px;
            }


            .home-link {
                font-size: 12px;
            }


            .success-page {
                padding: 35px 0;
            }


            .success-card {
                padding: 40px 20px;
            }


            .success-icon {
                width: 75px;
                height: 75px;

                font-size: 32px;
            }


            .actions {
                flex-direction: column;
            }


            .btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="site-header">

        <div class="container navbar">

            <a
                href="../index.html"
                class="logo"
            >

                <span class="logo-icon">
                    <i class="fas fa-bag-shopping"></i>
                </span>

                <span>
                    ShopHub
                </span>

            </a>


            <a
                href="../index.html"
                class="home-link"
            >

                <i class="fas fa-house"></i>

                Home

            </a>

        </div>

    </header>


    <!-- SUCCESS -->

    <main class="success-page">

        <div class="container">

            <div class="success-card">


                <div class="success-icon">

                    <i class="fas fa-check"></i>

                </div>


                <span class="success-label">
                    ORDER CONFIRMED
                </span>


                <h1>
                    Thank You!
                </h1>


                <p id="successMessage">
                    Your order has been successfully placed.
                    We appreciate your purchase from ShopHub.
                </p>


                <div class="order-number">

                    Order Number:

                    <strong id="orderNumber">
                        SH-000000
                    </strong>

                </div>


                <div class="actions">

                    <a
                        href="../shop/index.html"
                        class="btn btn-primary"
                    >

                        <i class="fas fa-store"></i>

                        Continue Shopping

                    </a>


                    <a
                        href="../index.html"
                        class="btn btn-secondary"
                    >

                        <i class="fas fa-house"></i>

                        Back to Home

                    </a>

                </div>


            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        © 2026 ShopHub. All rights reserved.

    </footer>


    <!-- SUCCESS PAGE JS -->

    <script>

        (function () {

            /* =========================================================
               BACKEND CONFIGURATION

               Local:
               http://localhost:5000

               Production:
               https://shophub-bice.vercel.app
            ========================================================= */

            const API_BASE_URL =
                window.location.hostname === "localhost" ||
                window.location.hostname === "127.0.0.1"
                    ? "http://localhost:5000"
                    : "https://shophub-bice.vercel.app";


            const orderNumberElement =
                document.getElementById(
                    "orderNumber"
                );


            const successMessage =
                document.getElementById(
                    "successMessage"
                );


            /* =========================================================
               STEP 1
               READ LAST ORDER
            ========================================================= */

            let lastOrder = null;


            try {

                const saved =
                    localStorage.getItem(
                        "lastOrder"
                    );


                lastOrder =
                    saved
                        ? JSON.parse(saved)
                        : null;


            } catch (error) {

                console.error(
                    "Unable to read last order:",
                    error
                );

                lastOrder = null;
            }


            if (
                lastOrder &&
                lastOrder.orderNumber &&
                orderNumberElement
            ) {

                orderNumberElement.textContent =
                    lastOrder.orderNumber;

            }


            /* =========================================================
               STEP 2
               VERIFY STRIPE PAYMENT

               Stripe redirects here with:

               ?session_id=...

               Backend endpoint:

               /api/payments/verify/:sessionId
            ========================================================= */

            async function verifyStripePayment() {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const sessionId =
                    params.get(
                        "session_id"
                    );


                if (!sessionId) {
                    return;
                }


                const token =
                    localStorage.getItem(
                        "authToken"
                    );


                if (!token) {
                    return;
                }


                try {

                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/payments/verify/${encodeURIComponent(sessionId)}`,
                            {
                                method: "GET",

                                headers: {
                                    "Authorization":
                                        `Bearer ${token}`
                                }
                            }
                        );


                    const data =
                        await response.json();


                    if (!data.success) {
                        return;
                    }


                    /* -------------------------------------------------
                       UPDATE ORDER NUMBER
                    ------------------------------------------------- */

                    if (
                        data.orderNumber &&
                        orderNumberElement
                    ) {

                        orderNumberElement.textContent =
                            data.orderNumber;

                    }


                    if (!successMessage) {
                        return;
                    }


                    /* -------------------------------------------------
                       PAYMENT CONFIRMED
                    ------------------------------------------------- */

                    if (data.paid) {

                        successMessage.textContent =
                            "Payment received successfully. Your ShopHub order is now confirmed.";

                    } else {

                        successMessage.textContent =
                            "We're still confirming your payment. This can take a moment — refresh this page shortly, or check your orders from your account.";

                    }


                } catch (error) {

                    console.error(
                        "Unable to verify Stripe payment:",
                        error
                    );

                }

            }


            /* =========================================================
               RUN PAYMENT VERIFICATION
            ========================================================= */

            verifyStripePayment();


            /* =========================================================
               DEBUG
            ========================================================= */

            console.log(
                "✅ ShopHub Success Page Loaded"
            );

            console.log(
                "🌐 Backend:",
                API_BASE_URL
            );

        })();

    </script>


</body>

</html>
