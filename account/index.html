<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopHub - My Account</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../style.css"><style>main{min-height:70vh;padding:80px 20px}.account-card{max-width:760px;margin:auto;padding:40px;border-radius:24px;background:#fff;box-shadow:0 15px 50px rgba(0,0,0,.08)}.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:25px}.account-link{display:flex;gap:12px;align-items:center;padding:18px;border:1px solid #e5e7eb;border-radius:14px;text-decoration:none;color:inherit}.account-link:hover{transform:translateY(-2px)}.danger{margin-top:25px;border:0;padding:12px 18px;border-radius:10px;cursor:pointer}</style></head><body><main><div class="account-card"><span class="section-label">MY ACCOUNT</span><h1 id="name">Account</h1><p id="email"></p><div class="account-grid"><a class="account-link" href="../orders/index.html"><i class="fas fa-box"></i> My Orders</a><a class="account-link" href="../wishlist/index.html"><i class="fas fa-heart"></i> Wishlist</a><a class="account-link" href="../shop/index.html"><i class="fas fa-store"></i> Continue Shopping</a></div><button id="logout" class="danger">Logout</button></div></main><script>(function(){const u=JSON.parse(localStorage.getItem('authUser')||'null');if(!u){location.href='../login/index.html';return}document.getElementById('name').textContent=u.name||'My Account';document.getElementById('email').textContent=u.email||'';document.getElementById('logout').onclick=()=>{localStorage.removeItem('authToken');localStorage.removeItem('authUser');location.href='../index.html'}})();</script>    <script src="../chatbot/chatbot.js"></script>
</body></html>
